name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "proto/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".golangci.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "cmd/**"
      - "internal/**"
      - "proto/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".golangci.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Test (race detector, with coverage)
        run: |
          # internal/api/pb (generated gRPC/protobuf code) and
          # internal/store/postgres + internal/store/queries (the sqlc-
          # generated glue and its hand-written wrapper, exercised only by
          # the separate, DB-backed integration-test job below) can't be
          # meaningfully covered by this unit-test run — they'd sit at a
          # permanent 0% and dilute the total into a number that doesn't
          # track real regressions. Excluded here (and in the gate step
          # below) for the same reason `make test-integration` is a
          # separate target rather than folded into this one.
          PKGS=$(go list ./... | grep -v -E '/internal/api/pb$|/internal/store/postgres$|/internal/store/queries$')
          go test -race -coverprofile=coverage.out -covermode=atomic $PKGS

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tail -1
          fi

      - name: Coverage gate
        run: |
          # Threshold set at roadmap Phase 5's baseline (~79.5% aggregate
          # across the packages coverage.out actually covers — see
          # demo/test-coverage-ci-gate.md) minus a couple points of buffer
          # against normal fluctuation, not chosen to just barely pass
          # today. Ratchet upward in a follow-up once there's more headroom
          # above it than below.
          THRESHOLD=78.0
          ACTUAL=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "Coverage: ${ACTUAL}% (threshold: ${THRESHOLD}%)"
          awk -v actual="$ACTUAL" -v threshold="$THRESHOLD" 'BEGIN { exit !(actual >= threshold) }' \
            || { echo "::error::Coverage ${ACTUAL}% is below the ${THRESHOLD}% gate"; exit 1; }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.out
          retention-days: 30
          if-no-files-found: ignore

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          # v9+ of the action is required to run golangci-lint v2 (and uses
          # the Node 24 runtime GitHub now requires). golangci-lint itself
          # needs to be v2.4+ for go1.25 support — see .golangci.yml, which
          # is a v2-schema config.
          version: v2.13

  integration-test:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sevitout
          POSTGRES_USER: sevitout
          POSTGRES_PASSWORD: sevitout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sevitout -d sevitout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sevitout:sevitout@localhost:5432/sevitout?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golang-migrate CLI
        run: go install -tags "postgres" github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.0

      - name: Run migrations
        run: migrate -path=./migrations -database "$DATABASE_URL" up

      - name: Run integration tests
        run: go test -tags integration -v ./internal/store/...
