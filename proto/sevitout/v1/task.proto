syntax = "proto3";

package sevitout.v1;

option go_package = "github.com/g8rswimmer/sevitout/internal/api/pb;pb";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// TaskService manages external task references linked to a SEV.
service TaskService {
  // LinkTask links an existing external task (e.g. a GitHub Issue URL) to a SEV.
  rpc LinkTask(LinkTaskRequest) returns (TaskResponse) {
    option (google.api.http) = {
      post: "/v1/sevs/{sev_id}/tasks"
      body: "*"
    };
  }

  // UnlinkTask removes a linked task from a SEV by its database ID.
  rpc UnlinkTask(UnlinkTaskRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/sevs/{sev_id}/tasks/{id}"
    };
  }

  // ListTasks returns all tasks linked to a SEV.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option (google.api.http) = {
      get: "/v1/sevs/{sev_id}/tasks"
    };
  }

  // UpdateTaskDueDate overrides the SLA-computed due date for a linked task.
  rpc UpdateTaskDueDate(UpdateTaskDueDateRequest) returns (TaskResponse) {
    option (google.api.http) = {
      patch: "/v1/sevs/{sev_id}/tasks/{id}/due-date"
      body: "*"
    };
  }

  // CreateGitHubIssue creates a new GitHub Issue pre-filled with SEV context,
  // links it to the SEV, and returns the linked task record.
  rpc CreateGitHubIssue(CreateGitHubIssueRequest) returns (TaskResponse) {
    option (google.api.http) = {
      post: "/v1/sevs/{sev_id}/github-issues"
      body: "*"
    };
  }

  // CreateJiraIssue creates a new Jira issue pre-filled with SEV context,
  // links it to the SEV, and returns the linked task record.
  rpc CreateJiraIssue(CreateJiraIssueRequest) returns (TaskResponse) {
    option (google.api.http) = {
      post: "/v1/sevs/{sev_id}/jira-issues"
      body: "*"
    };
  }
}

// TaskResponse is the linked task record returned by all TaskService RPCs.
message TaskResponse {
  int64 id = 1;
  string sev_id = 2;
  // external_system identifies the tracker (e.g. "github", "generic").
  string external_system = 3;
  // task_id is the external identifier (e.g. "owner/repo#42" for GitHub Issues).
  string task_id = 4;
  string url = 5;
  string title = 6;
  string description = 7;
  // relationship_type: action-item | contributing-factor | follow-up | dependency
  string relationship_type = 8;
  // priority: critical | non-critical
  string priority = 9;
  // due_date is null when the SEV has not yet been resolved.
  google.protobuf.Timestamp due_date = 10;
  bool overdue = 11;
  google.protobuf.Timestamp created_at = 12;
  string created_by = 13;
  // assignee is the tracker-native assignee identifier set at issue-creation
  // time (a GitHub login, or a Jira account ID) — see
  // CreateGitHubIssueRequest.assignee / CreateJiraIssueRequest.assignee_account_id
  // (docs/roadmap.md Phase 10f). Absent for tasks linked via LinkTask, or
  // created before this field existed.
  string assignee = 14;
  // assignee_name is the Sevitout display name of the assignee, resolved
  // server-side at creation time from CreateGitHubIssueRequest.assignee_user_id
  // / CreateJiraIssueRequest.assignee_user_id — a snapshot, not a live
  // lookup, the same trade-off already accepted for SEVRoleResponse's own
  // display_name. Absent when the assignee wasn't picked from Sevitout's
  // own directory (e.g. a raw API call supplying only the tracker-native
  // `assignee`); clients should fall back to `assignee` for display in that
  // case.
  string assignee_name = 15;
}

message LinkTaskRequest {
  string sev_id = 1;
  // external_system identifies the tracker (e.g. "github", "generic").
  string external_system = 2;
  // task_id is the external identifier (e.g. "owner/repo#42").
  string task_id = 3;
  string url = 4;
  string title = 5;
  string description = 6;
  // relationship_type: action-item | contributing-factor | follow-up | dependency
  string relationship_type = 7;
  // priority: critical | non-critical (controls default SLA due date).
  string priority = 8;
  // due_date overrides the computed SLA due date when provided.
  google.protobuf.Timestamp due_date = 9;
}

message UnlinkTaskRequest {
  string sev_id = 1;
  int64 id = 2;
}

message ListTasksRequest {
  string sev_id = 1;
}

message ListTasksResponse {
  repeated TaskResponse tasks = 1;
}

message UpdateTaskDueDateRequest {
  string sev_id = 1;
  int64 id = 2;
  google.protobuf.Timestamp due_date = 3;
}

message CreateGitHubIssueRequest {
  string sev_id = 1;
  // owner is the GitHub organisation or user (e.g. "acme-corp").
  string owner = 2;
  // repo is the repository name (e.g. "my-service").
  string repo = 3;
  string title = 4;
  // body is the issue description; callers should pre-fill with SEV context.
  string body = 5;
  // relationship_type: action-item | contributing-factor | follow-up | dependency
  string relationship_type = 6;
  // priority: critical | non-critical (controls default SLA due date).
  string priority = 7;
  // assignee is a GitHub login to assign the new issue to (wrapped into
  // GitHub's assignees: []string at the client layer). Optional — an empty
  // value creates the issue unassigned (docs/roadmap.md Phase 10f).
  string assignee = 8;
  // assignee_user_id is the Sevitout user ID of the picked assignee, when
  // picked via the frontend's directory-backed AssigneePicker (as opposed
  // to a raw API call supplying only `assignee` directly) — the server
  // resolves it to that user's current display name and stores it as
  // TaskResponse.assignee_name, so the linked-tasks list can show a person's
  // name instead of their opaque GitHub login. Optional; a lookup failure
  // (e.g. an unrecognized ID) is non-fatal — issue creation still succeeds,
  // just without assignee_name set.
  string assignee_user_id = 9;
}

message CreateJiraIssueRequest {
  string sev_id = 1;
  // project_key is the Jira project's key (e.g. "OPS"), not its numeric ID.
  string project_key = 2;
  // issue_type is the target project's issue type name (e.g. "Task", "Bug")
  // — it must already exist on that project.
  string issue_type = 3;
  // summary is the issue's title (Jira's naming for the field GitHub calls
  // "title").
  string summary = 4;
  // description is the issue body; callers should pre-fill with SEV
  // context.
  string description = 5;
  // relationship_type: action-item | contributing-factor | follow-up | dependency
  string relationship_type = 6;
  // priority: critical | non-critical (controls default SLA due date).
  string priority = 7;
  // assignee_account_id is a Jira Cloud account ID to assign the new issue
  // to (sent as Jira's assignee: {accountId: "..."}). Optional — an empty
  // value creates the issue unassigned. Unlike a GitHub login, this is an
  // opaque ID a user typically can't see in Jira's own UI without an
  // email->accountId lookup (docs/roadmap.md Phase 10f's documented UX risk).
  string assignee_account_id = 8;
  // assignee_user_id is the Sevitout user ID of the picked assignee — same
  // meaning as CreateGitHubIssueRequest.assignee_user_id, resolved into
  // TaskResponse.assignee_name the same way.
  string assignee_user_id = 9;
}
