syntax = "proto3";

package sevitout.v1;

option go_package = "github.com/g8rswimmer/sevitout/internal/api/pb;pb";

import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "google/protobuf/timestamp.proto";

// ReportService provides dashboard metrics, recurring-incident trend
// detection, and CSV export over SEV records (docs/requirements.md §17).
service ReportService {
  rpc GetDashboardMetrics(GetDashboardMetricsRequest) returns (DashboardMetricsResponse) {
    option (google.api.http) = {
      get: "/v1/reports/dashboard"
    };
  }
  // GetSEVTrends surfaces recurring failure patterns: SEVs sharing the same
  // affected service and root cause category (§17's "recurring incident
  // flag").
  rpc GetSEVTrends(GetSEVTrendsRequest) returns (SEVTrendsResponse) {
    option (google.api.http) = {
      get: "/v1/reports/trends"
    };
  }
  // ExportSEVs returns a filtered SEV list as CSV. The response is raw
  // text/csv bytes (google.api.HttpBody), not JSON — cmd/server/main.go
  // wraps the gateway's marshaler in runtime.HTTPBodyMarshaler, which
  // detects this response type and writes GetData() as the HTTP body with
  // GetContentType() as Content-Type instead of JSON-encoding it.
  rpc ExportSEVs(ExportSEVsRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {
      get: "/v1/sevs/export.csv"
    };
  }
  // GetServiceMetrics aggregates SEVs into per-(service, severity level)
  // rollups over a trailing window: SEV count, average MTTD/MTTM/MTTR, and
  // an SLA compliance breakdown (docs/roadmap.md Phase 13 — the aggregate
  // counterpart to Phase 12's per-SEV live sla_status on SEVResponse).
  rpc GetServiceMetrics(GetServiceMetricsRequest) returns (ServiceMetricsResponse) {
    option (google.api.http) = {
      get: "/v1/reports/service-metrics"
    };
  }
}

message GetDashboardMetricsRequest {}

message ActiveSEVCount {
  int32 severity_level = 1;
  int32 count = 2;
}

message MTTRTrend {
  // window_days is one of: 7, 30, 90.
  int32 window_days = 1;
  // average_mttr_seconds is the mean MTTRSeconds across SEVs resolved within
  // the last window_days days. 0 when no SEV resolved in that window.
  int64 average_mttr_seconds = 2;
  int32 sample_size = 3;
}

message ServiceLevelFrequency {
  string service_id = 1;
  int32 severity_level = 2;
  int32 count = 3;
}

message DashboardMetricsResponse {
  repeated ActiveSEVCount active_by_level = 1;
  // mttr_trends always has exactly 3 entries: 7, 30, and 90-day windows.
  repeated MTTRTrend mttr_trends = 2;
  repeated ServiceLevelFrequency frequency_by_service_and_level = 3;
  // postmortem_completion_rate is approved postmortems divided by total
  // postmortems, in [0, 1]. 0 when there are no postmortems yet.
  double postmortem_completion_rate = 4;
  int32 overdue_task_count = 5;
}

message GetSEVTrendsRequest {}

message RecurringPattern {
  string service_id = 1;
  string root_cause_category = 2;
  int32 count = 3;
  // sev_ids is sorted most-recently-created first.
  repeated string sev_ids = 4;
}

message SEVTrendsResponse {
  repeated RecurringPattern recurring_patterns = 1;
}

message ExportSEVsRequest {
  repeated int32 severity_levels = 1;
  repeated string statuses = 2;
  repeated string service_ids = 3;
  string root_cause_category = 4;
  google.protobuf.Timestamp started_after = 5;
  google.protobuf.Timestamp started_before = 6;
}

message GetServiceMetricsRequest {
  // window_days is one of: 30, 60, 90, 180. Defaults to 30 when unset or 0
  // — validated in the handler, not here.
  int32 window_days = 1;
  repeated string service_ids = 2;
}

message ServiceLevelMetrics {
  string service_id = 1;
  int32 severity_level = 2;
  int32 sev_count = 3;
  // avg_mttd_seconds/avg_mttm_seconds/avg_mttr_seconds average only the
  // SEVs in this group with that metric already computed (nil-safe, same
  // discipline as MTTRTrend) — 0 when none have it yet.
  int64 avg_mttd_seconds = 4;
  int64 avg_mttm_seconds = 5;
  int64 avg_mttr_seconds = 6;
  // sla_*_count bucket this group's SEVs by their live SLAEvaluation.Overall
  // (internal/sev/sla.go) — sla_not_applicable_count covers both "no SLA
  // configured for this service+severity" and "no baseline timestamp yet".
  int32 sla_ok_count = 7;
  int32 sla_at_risk_count = 8;
  int32 sla_breached_count = 9;
  int32 sla_not_applicable_count = 10;
  // compliance_pct is sla_ok_count / (sla_ok_count + sla_at_risk_count +
  // sla_breached_count), 0 when that denominator is 0 (every SEV in the
  // group is sla_not_applicable — not a real 0% compliance claim).
  double compliance_pct = 11;
}

message ServiceMetricsResponse {
  repeated ServiceLevelMetrics service_level_metrics = 1;
  // window_days echoes back the resolved window (after defaulting), same
  // defensive pattern MTTRTrend.window_days uses.
  int32 window_days = 2;
}
