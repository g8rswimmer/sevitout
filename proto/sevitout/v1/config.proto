syntax = "proto3";

package sevitout.v1;

option go_package = "github.com/g8rswimmer/sevitout/internal/api/pb;pb";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// ConfigService is the admin configuration surface: service registry, user
// role management, on-call rotations, integration credentials, and data
// retention policy. Every RPC requires the Admin role except where noted.
service ConfigService {
  // --- Service registry (§18.1) ---

  rpc CreateService(CreateServiceRequest) returns (ServiceResponse) {
    option (google.api.http) = {
      post: "/v1/config/services"
      body: "*"
    };
  }
  rpc GetService(GetServiceRequest) returns (ServiceResponse) {
    option (google.api.http) = {
      get: "/v1/config/services/{id}"
    };
  }
  rpc UpdateService(UpdateServiceRequest) returns (ServiceResponse) {
    option (google.api.http) = {
      patch: "/v1/config/services/{id}"
      body: "*"
    };
  }
  // DeleteService permanently removes a service record. To retire a service
  // while preserving historical SEV references, prefer UpdateService with
  // active=false instead.
  rpc DeleteService(DeleteServiceRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/config/services/{id}"
    };
  }
  // ListServices is readable by any authenticated user (Viewer+) since
  // services are referenced throughout the system (e.g. picking affected
  // services on a SEV).
  rpc ListServices(ListServicesRequest) returns (ListServicesResponse) {
    option (google.api.http) = {
      get: "/v1/config/services"
    };
  }

  // --- Per-service, per-severity-level SLA targets (docs/roadmap.md
  // Phase 12) --- readable by any authenticated user (Viewer+), same floor
  // as GetService/ListServices — the resolved numbers are already exposed to
  // any Viewer via SEVResponse.sla_status, so gating the raw config any
  // tighter would protect nothing. Mutations (Upsert/Delete) are Admin-only,
  // matching UpdateService/DeleteService.
  rpc GetServiceSLA(GetServiceSLARequest) returns (ServiceSLAResponse) {
    option (google.api.http) = {
      get: "/v1/config/services/{service_id}/sla/{severity_level}"
    };
  }
  rpc UpsertServiceSLA(UpsertServiceSLARequest) returns (ServiceSLAResponse) {
    option (google.api.http) = {
      put: "/v1/config/services/{service_id}/sla/{severity_level}"
      body: "*"
    };
  }
  rpc DeleteServiceSLA(DeleteServiceSLARequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/config/services/{service_id}/sla/{severity_level}"
    };
  }
  // ListServiceSLAs returns every configured severity row (0-4) for one
  // service — what the admin editor renders as its 4-row table.
  rpc ListServiceSLAs(ListServiceSLAsRequest) returns (ListServiceSLAsResponse) {
    option (google.api.http) = {
      get: "/v1/config/services/{service_id}/sla"
    };
  }

  // --- Per-service SEV leveling criteria (docs/roadmap.md Phase 14) ---
  // free-text guidance for what qualifies as one severity level for one
  // service — purely advisory, never enforced or validated against. Reads
  // sit at the same Viewer floor as GetServiceSLA/ListServiceSLAs, since
  // this is exactly what the SEV creation form and postmortem page need for
  // any authenticated user opening or reviewing a SEV. Mutations are
  // Admin-only, matching UpsertServiceSLA/DeleteServiceSLA.
  rpc GetLevelingCriteria(GetLevelingCriteriaRequest) returns (LevelingCriteriaResponse) {
    option (google.api.http) = {
      get: "/v1/config/services/{service_id}/leveling-criteria/{severity_level}"
    };
  }
  rpc UpsertLevelingCriteria(UpsertLevelingCriteriaRequest) returns (LevelingCriteriaResponse) {
    option (google.api.http) = {
      put: "/v1/config/services/{service_id}/leveling-criteria/{severity_level}"
      body: "*"
    };
  }
  rpc DeleteLevelingCriteria(DeleteLevelingCriteriaRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/config/services/{service_id}/leveling-criteria/{severity_level}"
    };
  }
  // ListLevelingCriteria returns every configured severity row (0-4) for one
  // service — what the admin editor renders as its 4-row table.
  rpc ListLevelingCriteria(ListLevelingCriteriaRequest) returns (ListLevelingCriteriaResponse) {
    option (google.api.http) = {
      get: "/v1/config/services/{service_id}/leveling-criteria"
    };
  }
  // ListLevelingCriteriaForServices is the batch lookup the SEV creation
  // form and postmortem page use: every configured row across a SEV's
  // (possibly multiple) affected services, at one severity level, no
  // reduction — see ServiceLevelingCriteriaStore.ListForServices. Spans
  // multiple services, so it sits at a top-level path rather than nested
  // under one service.
  rpc ListLevelingCriteriaForServices(ListLevelingCriteriaForServicesRequest) returns (ListLevelingCriteriaForServicesResponse) {
    option (google.api.http) = {
      get: "/v1/config/leveling-criteria"
    };
  }

  // --- User management (§18.2, §14) ---

  // ListUsers is Admin-only; the directory includes email addresses.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/v1/config/users"
    };
  }
  rpc UpdateUserRole(UpdateUserRoleRequest) returns (UserResponse) {
    option (google.api.http) = {
      patch: "/v1/config/users/{id}/role"
      body: "*"
    };
  }
  rpc DeactivateUser(DeactivateUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      post: "/v1/config/users/{id}/deactivate"
      body: "*"
    };
  }
  rpc ReactivateUser(ReactivateUserRequest) returns (UserResponse) {
    option (google.api.http) = {
      post: "/v1/config/users/{id}/reactivate"
      body: "*"
    };
  }

  // --- On-call configuration (§18.3) ---

  rpc CreateOnCallRotation(CreateOnCallRotationRequest) returns (OnCallRotationResponse) {
    option (google.api.http) = {
      post: "/v1/config/oncall"
      body: "*"
    };
  }
  rpc GetOnCallRotation(GetOnCallRotationRequest) returns (OnCallRotationResponse) {
    option (google.api.http) = {
      get: "/v1/config/oncall/{id}"
    };
  }
  rpc UpdateOnCallRotation(UpdateOnCallRotationRequest) returns (OnCallRotationResponse) {
    option (google.api.http) = {
      patch: "/v1/config/oncall/{id}"
      body: "*"
    };
  }
  rpc DeleteOnCallRotation(DeleteOnCallRotationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/config/oncall/{id}"
    };
  }
  // ListOnCallRotations is readable by any authenticated user (Viewer+) so
  // the UI can show who is currently on-call.
  rpc ListOnCallRotations(ListOnCallRotationsRequest) returns (ListOnCallRotationsResponse) {
    option (google.api.http) = {
      get: "/v1/config/oncall"
    };
  }

  // --- Integration configuration (§18.4) ---

  // GetIntegrationCatalog returns the fixed, ordered field schema for every
  // integration_type this server recognizes (docs/roadmap.md Phase 9) — a
  // pure translation of internal/integrations/catalog.All with no store
  // access. It's the single source of truth the admin UI renders its
  // sidebar + schema-driven detail form from, and UpsertIntegrationConfig
  // validates incoming requests against the same catalog.
  rpc GetIntegrationCatalog(GetIntegrationCatalogRequest) returns (GetIntegrationCatalogResponse) {
    option (google.api.http) = {
      // Deliberately not nested under /v1/config/integrations/{integration_type}
      // — "catalog" would collide with that path template (grpc-gateway
      // resolves the ambiguity in favor of the wildcard route, silently
      // routing this to GetIntegrationConfig instead), so this lives as a
      // sibling path instead, matching GetSlackBotCredential's same reasoning
      // for its own non-colliding path just above.
      get: "/v1/config/integration-catalog"
    };
  }
  // UpsertIntegrationConfig creates or replaces the settings and credentials
  // for one integration type. Credentials are encrypted (AES-256-GCM) before
  // being written to storage and are never returned by any RPC in this
  // service — only whether credentials are currently configured. The
  // integration_type and every credential/settings key (and, for a select
  // field, its value) are validated against GetIntegrationCatalog's schema
  // before anything is written — see this RPC's handler doc comment.
  rpc UpsertIntegrationConfig(UpsertIntegrationConfigRequest) returns (IntegrationConfigResponse) {
    option (google.api.http) = {
      put: "/v1/config/integrations/{integration_type}"
      body: "*"
    };
  }
  rpc GetIntegrationConfig(GetIntegrationConfigRequest) returns (IntegrationConfigResponse) {
    option (google.api.http) = {
      get: "/v1/config/integrations/{integration_type}"
    };
  }
  // GetSlackBotCredential returns the decrypted "slack" integration
  // credential pair (bot_token/app_token) — the one deliberate exception to
  // "credentials are never returned by any RPC in this service" above. It
  // exists solely so cmd/slackbot (a separate process that only talks to
  // this API over gRPC, with no direct datastore/encryption-key access) can
  // pick up a datastore-configured Slack token without a restart; see
  // docs/roadmap.md Phase 8. Gated server-side to the specific slackbot
  // service account (SLACKBOT_SERVICE_EMAIL), not merely Admin+ — an
  // unrelated admin session must not be able to pull plaintext Slack tokens
  // through this call. Returns empty fields (not an error) when the "slack"
  // integration has no credentials configured, so callers can fall back to
  // their own static tokens.
  rpc GetSlackBotCredential(GetSlackBotCredentialRequest) returns (GetSlackBotCredentialResponse) {
    option (google.api.http) = {
      get: "/v1/config/integrations/slack/bot-credential"
    };
  }
  rpc ListIntegrationConfigs(ListIntegrationConfigsRequest) returns (ListIntegrationConfigsResponse) {
    option (google.api.http) = {
      get: "/v1/config/integrations"
    };
  }
  // ListEnabledIntegrations is a viewer-safe signal of which integration_types
  // currently have meaningful store-configured settings or credentials
  // (docs/roadmap.md Phase 11a) — used by the SEV detail page to hide an
  // integration-tied action (e.g. "Create Jira issue") when that integration
  // isn't configured, without exposing anything an Admin-only endpoint
  // wouldn't already consider safe to hand to any Viewer: no settings
  // values, no credentials_configured per type, just the list of enabled
  // types. Reflects store-configured integrations only — see this RPC's
  // response doc comment for the static-env-var-fallback limitation.
  rpc ListEnabledIntegrations(ListEnabledIntegrationsRequest) returns (ListEnabledIntegrationsResponse) {
    option (google.api.http) = {
      get: "/v1/config/enabled-integrations"
    };
  }

  // --- Data retention (§18.7) ---

  rpc GetRetentionConfig(GetRetentionConfigRequest) returns (RetentionConfigResponse) {
    option (google.api.http) = {
      get: "/v1/config/retention/{severity_level}"
    };
  }
  rpc UpdateRetentionConfig(UpdateRetentionConfigRequest) returns (RetentionConfigResponse) {
    option (google.api.http) = {
      put: "/v1/config/retention/{severity_level}"
      body: "*"
    };
  }
  rpc ListRetentionConfig(ListRetentionConfigRequest) returns (ListRetentionConfigResponse) {
    option (google.api.http) = {
      get: "/v1/config/retention"
    };
  }

  // --- AI plugin registration (§18.6) ---
  //
  // Registering, enabling/disabling, and configuring AI plugins (provider,
  // model, encrypted API key, per-trigger enable flags, rate limit) is
  // Admin-only, same as every other resource in this service. The
  // functional, non-admin surface for actually running AI actions and
  // reading their output lives on AIService (proto/sevitout/v1/ai.proto).

  rpc CreateAIPlugin(CreateAIPluginRequest) returns (AIPluginResponse) {
    option (google.api.http) = {
      post: "/v1/config/ai-plugins"
      body: "*"
    };
  }
  rpc GetAIPlugin(GetAIPluginRequest) returns (AIPluginResponse) {
    option (google.api.http) = {
      get: "/v1/config/ai-plugins/{id}"
    };
  }
  rpc UpdateAIPlugin(UpdateAIPluginRequest) returns (AIPluginResponse) {
    option (google.api.http) = {
      patch: "/v1/config/ai-plugins/{id}"
      body: "*"
    };
  }
  rpc DeleteAIPlugin(DeleteAIPluginRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/config/ai-plugins/{id}"
    };
  }
  rpc ListAIPlugins(ListAIPluginsRequest) returns (ListAIPluginsResponse) {
    option (google.api.http) = {
      get: "/v1/config/ai-plugins"
    };
  }
}

// ── Service registry ─────────────────────────────────────────────────────────

message ServiceResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  string owning_team = 4;
  string pagerduty_service_id = 5;
  map<string, string> tags = 6;
  bool active = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateServiceRequest {
  // id is a caller-supplied slug (e.g. "checkout"); it is the stable
  // identifier referenced elsewhere (affected services, SLIs, on-call).
  string id = 1;
  string name = 2;
  string description = 3;
  string owning_team = 4;
  string pagerduty_service_id = 5;
  map<string, string> tags = 6;
}

message GetServiceRequest {
  string id = 1;
}

message UpdateServiceRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string owning_team = 4;
  string pagerduty_service_id = 5;
  map<string, string> tags = 6;
  google.protobuf.BoolValue active = 7;
}

message DeleteServiceRequest {
  string id = 1;
}

message ListServicesRequest {
  bool active_only = 1;
}

message ListServicesResponse {
  repeated ServiceResponse services = 1;
}

// ── Per-service SLA targets (docs/roadmap.md Phase 12) ──────────────────────

message ServiceSLAResponse {
  string service_id = 1;
  int32 severity_level = 2;
  // Target seconds per metric; 0 means unset (no SLA for that metric at this
  // severity level).
  int64 mttd_target_seconds = 3;
  int64 mttm_target_seconds = 4;
  int64 mttr_target_seconds = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  // rtpc_target_seconds targets Resolution to Postmortem Complete — see
  // SEVResponse.rtpc_seconds.
  int64 rtpc_target_seconds = 8;
}

message GetServiceSLARequest {
  string service_id = 1;
  int32 severity_level = 2;
}

message UpsertServiceSLARequest {
  string service_id = 1;
  int32 severity_level = 2;
  // A field left at 0 clears that metric's target (full-replace, like
  // UpdateRetentionConfigRequest — not a sparse patch).
  int64 mttd_target_seconds = 3;
  int64 mttm_target_seconds = 4;
  int64 mttr_target_seconds = 5;
  int64 rtpc_target_seconds = 6;
}

message DeleteServiceSLARequest {
  string service_id = 1;
  int32 severity_level = 2;
}

message ListServiceSLAsRequest {
  string service_id = 1;
}

message ListServiceSLAsResponse {
  repeated ServiceSLAResponse slas = 1;
}

// ── Per-service SEV leveling criteria (docs/roadmap.md Phase 14) ───────────

message LevelingCriteriaResponse {
  string service_id = 1;
  int32 severity_level = 2;
  string criteria = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message GetLevelingCriteriaRequest {
  string service_id = 1;
  int32 severity_level = 2;
}

message UpsertLevelingCriteriaRequest {
  string service_id = 1;
  int32 severity_level = 2;
  string criteria = 3;
}

message DeleteLevelingCriteriaRequest {
  string service_id = 1;
  int32 severity_level = 2;
}

message ListLevelingCriteriaRequest {
  string service_id = 1;
}

message ListLevelingCriteriaResponse {
  repeated LevelingCriteriaResponse criteria = 1;
}

message ListLevelingCriteriaForServicesRequest {
  repeated string service_ids = 1;
  int32 severity_level = 2;
}

message ListLevelingCriteriaForServicesResponse {
  repeated LevelingCriteriaResponse criteria = 1;
}

// ── User management ──────────────────────────────────────────────────────────

message UserResponse {
  string id = 1;
  string email = 2;
  string name = 3;
  string avatar_url = 4;
  string org_role = 5;
  bool active = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // slack_user_id, github_username, and jira_account_id mirror
  // WhoAmIResponse's self-service identity fields (docs/roadmap.md Phase
  // 10a) — read-only here (AdminUsersPage shows, but never edits, another
  // user's identities; each user manages their own via /profile).
  string slack_user_id = 9;
  string github_username = 10;
  string jira_account_id = 11;
}

message ListUsersRequest {
  // query filters the directory by a case-insensitive substring match
  // against name or email; empty returns everyone.
  string query = 1;
}

message ListUsersResponse {
  repeated UserResponse users = 1;
}

message UpdateUserRoleRequest {
  string id = 1;
  // org_role: viewer | responder | incident-commander | admin
  string org_role = 2;
}

message DeactivateUserRequest {
  string id = 1;
}

message ReactivateUserRequest {
  string id = 1;
}

// ── On-call configuration ────────────────────────────────────────────────────

message OnCallRotationResponse {
  int64 id = 1;
  string name = 2;
  string service_id = 3;
  string pagerduty_schedule_id = 4;
  string manual_user_id = 5;
  string manual_display_name = 6;
  google.protobuf.Timestamp override_start = 7;
  google.protobuf.Timestamp override_end = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message CreateOnCallRotationRequest {
  string name = 1;
  string service_id = 2;
  string pagerduty_schedule_id = 3;
  // manual_user_id / manual_display_name plus a override_start/override_end
  // window define a manual override for a planned change; omit all four for
  // a normal PagerDuty-backed rotation.
  string manual_user_id = 4;
  string manual_display_name = 5;
  google.protobuf.Timestamp override_start = 6;
  google.protobuf.Timestamp override_end = 7;
}

message GetOnCallRotationRequest {
  int64 id = 1;
}

message UpdateOnCallRotationRequest {
  int64 id = 1;
  string name = 2;
  string service_id = 3;
  string pagerduty_schedule_id = 4;
  string manual_user_id = 5;
  string manual_display_name = 6;
  google.protobuf.Timestamp override_start = 7;
  google.protobuf.Timestamp override_end = 8;
}

message DeleteOnCallRotationRequest {
  int64 id = 1;
}

message ListOnCallRotationsRequest {}

message ListOnCallRotationsResponse {
  repeated OnCallRotationResponse rotations = 1;
}

// ── Integration configuration ────────────────────────────────────────────────

// CatalogField describes one credential or settings key an integration_type
// accepts — see internal/integrations/catalog.Field, which this mirrors
// field-for-field.
message CatalogField {
  // key is the storage key exactly as read/written by UpsertIntegrationConfig
  // (e.g. "bot_token", "cloud_id") — never itself shown to an admin; see label.
  string key = 1;
  string label = 2;
  // kind: "text" | "secret" | "select". "secret" fields are write-only
  // credentials, rendered password-masked; "select" fields must be one of
  // options.
  string kind = 3;
  // required is a UI-only affordance — see UpsertIntegrationConfig's doc
  // comment for why it isn't enforced server-side at upsert time.
  bool required = 4;
  string help = 5;
  // options lists the valid values for a "select" field; empty otherwise.
  repeated string options = 6;
}

// IntegrationCatalogEntry describes one integration_type's complete field
// schema — see internal/integrations/catalog.Integration.
message IntegrationCatalogEntry {
  string type = 1;
  string label = 2;
  // credential_fields is empty for a settings-only integration (Monitoring).
  repeated CatalogField credential_fields = 3;
  repeated CatalogField settings_fields = 4;
}

message GetIntegrationCatalogRequest {}

message GetIntegrationCatalogResponse {
  // integrations is fixed-order — the order the admin UI's sidebar renders
  // in — matching internal/integrations/catalog.All exactly.
  repeated IntegrationCatalogEntry integrations = 1;
}

message IntegrationConfigResponse {
  string integration_type = 1;
  // credentials_configured is true when a non-empty credentials blob has
  // been stored; the decrypted value itself is never returned.
  bool credentials_configured = 2;
  map<string, string> settings = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message UpsertIntegrationConfigRequest {
  // integration_type: one of GetIntegrationCatalog's fixed set — e.g.
  // "slack", "pagerduty", "github", "jira", "monitoring". Any other value is
  // rejected.
  string integration_type = 1;
  // credentials is write-only: encrypted with AES-256-GCM before storage.
  // Omit (leave empty) to keep the existing stored credentials unchanged
  // while updating settings.
  map<string, string> credentials = 2;
  map<string, string> settings = 3;
}

message GetIntegrationConfigRequest {
  string integration_type = 1;
}

message GetSlackBotCredentialRequest {}

message GetSlackBotCredentialResponse {
  // bot_token / app_token are empty when the "slack" integration has no
  // datastore-configured credentials — not an error, since the caller has a
  // static-env-var fallback of its own.
  string bot_token = 1;
  string app_token = 2;
}

message ListIntegrationConfigsRequest {}

message ListIntegrationConfigsResponse {
  repeated IntegrationConfigResponse configs = 1;
}

message ListEnabledIntegrationsRequest {}

message ListEnabledIntegrationsResponse {
  // enabled_types lists the integration_types (e.g. "slack", "jira") that
  // currently have a meaningful store-configured credentials or settings
  // blob — the same "configured" concept the admin UI already uses (see
  // GetIntegrationCatalog). Known limitation: an integration activated only
  // via its static env-var fallback (PagerDuty/GitHub/Jira, with zero store
  // rows — see cmd/server's *Resolver types) is not reflected here, so it
  // shows as "not enabled" even though the backend would actually serve the
  // request. See docs/roadmap.md Phase 11a for why a fully accurate signal
  // is out of scope for this phase.
  repeated string enabled_types = 1;
}

// ── Data retention ────────────────────────────────────────────────────────────

message RetentionConfigResponse {
  int32 severity_level = 1;
  // retention_days == 0 means retain forever.
  int32 retention_days = 2;
  // hard_delete controls what happens on expiry: false archives
  // (soft-delete), true purges permanently.
  bool hard_delete = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message GetRetentionConfigRequest {
  int32 severity_level = 1;
}

message UpdateRetentionConfigRequest {
  int32 severity_level = 1;
  int32 retention_days = 2;
  bool hard_delete = 3;
}

message ListRetentionConfigRequest {}

message ListRetentionConfigResponse {
  repeated RetentionConfigResponse configs = 1;
}

// ── AI plugin registration ───────────────────────────────────────────────────

message AIPluginResponse {
  int64 id = 1;
  string name = 2;
  string version = 3;
  string description = 4;
  // handler_type: "builtin" (internal/ai's built-in Anthropic provider) or "http".
  string handler_type = 5;
  string http_endpoint = 6;
  string provider = 7;
  string model = 8;
  // api_key_configured is true when an encrypted API key has been stored;
  // the decrypted value itself is never returned, same policy as
  // IntegrationConfigResponse.credentials_configured.
  bool api_key_configured = 9;
  bool enabled = 10;
  bool trigger_on_open = 11;
  bool trigger_on_mitigated = 12;
  bool trigger_on_resolved = 13;
  bool trigger_on_postmortem_review = 14;
  // rate_limit_per_minute caps AI actions per minute for this plugin; 0 means unlimited.
  int32 rate_limit_per_minute = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
}

message CreateAIPluginRequest {
  string name = 1;
  string version = 2;
  string description = 3;
  string handler_type = 4;
  string http_endpoint = 5;
  string provider = 6;
  string model = 7;
  // api_key is write-only: encrypted with AES-256-GCM before storage, like
  // UpsertIntegrationConfigRequest.credentials.
  string api_key = 8;
  bool enabled = 9;
  bool trigger_on_open = 10;
  bool trigger_on_mitigated = 11;
  bool trigger_on_resolved = 12;
  bool trigger_on_postmortem_review = 13;
  int32 rate_limit_per_minute = 14;
}

message GetAIPluginRequest {
  int64 id = 1;
}

message UpdateAIPluginRequest {
  int64 id = 1;
  string name = 2;
  string version = 3;
  string description = 4;
  string handler_type = 5;
  string http_endpoint = 6;
  string provider = 7;
  string model = 8;
  // api_key, when non-empty, replaces the stored key; omit to keep the
  // existing one unchanged.
  string api_key = 9;
  google.protobuf.BoolValue enabled = 10;
  google.protobuf.BoolValue trigger_on_open = 11;
  google.protobuf.BoolValue trigger_on_mitigated = 12;
  google.protobuf.BoolValue trigger_on_resolved = 13;
  google.protobuf.BoolValue trigger_on_postmortem_review = 14;
  // rate_limit_per_minute: unlike the response/create messages, 0 is a
  // meaningful value here (explicitly reset to unlimited), so this must be
  // wrapped to distinguish "not supplied" (nil) from "set to 0".
  google.protobuf.Int32Value rate_limit_per_minute = 15;
}

