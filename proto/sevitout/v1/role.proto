syntax = "proto3";

package sevitout.v1;

option go_package = "github.com/g8rswimmer/sevitout/internal/api/pb;pb";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// RoleService manages people and role assignments on a SEV.
service RoleService {
  rpc AssignRole(AssignRoleRequest) returns (SEVRoleResponse) {
    option (google.api.http) = {
      post: "/v1/sevs/{sev_id}/roles"
      body: "*"
    };
  }
  rpc RemoveRole(RemoveRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/sevs/{sev_id}/roles/{id}"
    };
  }
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {
      get: "/v1/sevs/{sev_id}/roles"
    };
  }
}

message SEVRoleResponse {
  int64 id = 1;
  string sev_id = 2;
  string role_type = 3;
  string user_id = 4;
  string display_name = 5;
  google.protobuf.Timestamp created_at = 6;
  string created_by = 7;
}

message AssignRoleRequest {
  string sev_id = 1;
  string role_type = 2;
  string user_id = 3;
  string display_name = 4;
  string created_by = 5;
}

message RemoveRoleRequest {
  string sev_id = 1;
  int64 id = 2;
}

message ListRolesRequest {
  string sev_id = 1;
}

message ListRolesResponse {
  repeated SEVRoleResponse roles = 1;
}
