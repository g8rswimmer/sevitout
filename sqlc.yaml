version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/"
    queries: "internal/store/sql/"
    gen:
      go:
        package: "queries"
        out: "internal/store/queries"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_methods_with_db_argument: false
