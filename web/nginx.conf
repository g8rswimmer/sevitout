# Serves the built SPA and proxies API paths to the `api` service under the
# same origin the browser loaded the page from — the production analog of
# vite.config.ts's dev-time `server.proxy`. This is what lets src/lib/api.ts
# make plain relative-path requests everywhere, so the Go API server (which
# has no CORS headers — see internal/api/ws/handler.go) never needs any.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /auth/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # GET /admin/integrations/health (internal/api/grpc/integrations_health.go)
    # — a plain net/http handler, not part of any gRPC service, so it isn't
    # under /v1/ like everything else ConfigService-shaped. Without this
    # block it silently fell through to the SPA fallback below and served
    # index.html instead of JSON, so AdminIntegrationsPage's health badges
    # always looked empty/unknown no matter what was actually configured.
    location /admin/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # Trailing slash matters here too, same reason as vite.config.ts's dev
    # proxy: a bare "/s" location would also match this SPA's own /sevs/:id
    # route.
    #
    # M14e added a React route at this exact path (PublicSharePage, App.tsx)
    # so a share link opens as a rendered page instead of raw JSON in the
    # browser — but the URL the backend hands out (ShareLinkResponse.path)
    # and the one this SPA route lives at are the same "/s/{token}" on
    # purpose, so both a browser and `curl` hit the identical link. A
    # browser's top-level navigation to that link sends an Accept header
    # that includes text/html; PublicSharePage's own fetch() call back to
    # this same URL (api.shareView.get, lib/api.ts) does not set that header
    # (default Accept: */*), and neither does curl unless told to — so
    # content-negotiating on Accept lets one path prefix serve both: the SPA
    # shell for a browser's initial navigation, and the real JSON handler
    # for everything else, including every existing curl example in
    # demo/M13-reporting-sharing.md, unchanged.
    location /s/ {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # index.html itself must never be cached by the browser. Two reasons:
    # every deploy ships new content-hashed asset filenames, so a stale
    # cached index.html can reference JS/CSS bundles that no longer exist —
    # a real bug even without M14e. And M14e specifically depends on this:
    # the /s/ block above serves this same file (via `rewrite ... last`,
    # which re-enters location matching and lands here) for a browser's
    # top-level navigation to a share link, and PublicSharePage's own
    # fetch() call moments later hits the *identical URL*
    # (GET /s/{token}) to fetch the real JSON. Without Cache-Control here,
    # nginx's default response for a static file (Last-Modified + ETag, no
    # explicit Cache-Control) is heuristically cacheable — confirmed live,
    # the browser served that fetch() straight from its own HTTP cache
    # without ever reaching nginx again, so the Accept-based negotiation
    # never even ran a second time and the page tried to JSON.parse
    # "<!doctype html>...". `no-store` rules that out entirely.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: any other path (client-side routes like /sevs/:id,
    # /login) resolves to index.html so React Router handles it.
    location / {
        try_files $uri /index.html;
    }
}
